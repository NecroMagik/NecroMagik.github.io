<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="XokDy4ztBtT6sMzTK60u2PY6KShHLnCdTw5XVvuNO2A" />
    <title>ZN / NecroMagik</title>
    <link rel="icon" type="image/png" href="Logo.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050a06;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Шапка с фоновым артом */
        .banner-header {
            width: 100%;
            height: 260px;
            background: url('header-bg.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .banner-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, transparent, #050a06);
        }

        /* Контейнер профиля */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -75px;
            z-index: 2;
            padding: 0 20px;
            text-align: center;
        }

        /* Аватар-логотип */
        .avatar-wrap {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #00ff55, #006622, #00220a);
            box-shadow: 0 0 25px rgba(0, 255, 85, 0.35);
            margin-bottom: 16px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .avatar-wrap:hover {
            transform: scale(1.04);
            box-shadow: 0 0 35px rgba(0, 255, 85, 0.55);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: #001004;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .zn-part {
            color: #ffffff;
        }

        .neeromagik-part {
            color: #00cc44;
            text-shadow: 0 0 15px rgba(0, 204, 68, 0.3);
        }

        .subtitle {
            font-size: 1.05rem;
            color: #8fa393;
            margin-bottom: 30px;
        }

        /* Контейнер кнопок */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 340px;
            padding: 0 20px 40px;
            z-index: 1;
        }

        .social-button {
            position: relative;
            padding: 16px 25px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            border-radius: 50px;
            background: #080f0a;
            color: white;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }

        /* Анимированная окантовка */
        .social-button::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff55, #1e3d2b, #444, #1e3d2b, #00ff55);
            border-radius: 52px;
            z-index: -1;
            animation: borderRotate 4s linear infinite;
            background-size: 400% 400%;
        }

        .social-button::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: #09120b;
            border-radius: 48px;
            z-index: -1;
            transition: background 0.3s ease;
        }

        .social-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 255, 85, 0.18);
        }

        .social-button:hover::after {
            background: #0f1c13;
        }

        /* Цвета кнопок */
        .youtube-btn { color: #ff3333; }
        .twitch-btn { color: #a970ff; }
        .vk-btn { color: #2787f5; }
        .tg-btn { color: #2ea5e8; }
        .discord-btn { color: #6b77f5; }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Футер */
        .footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.85rem;
            color: #4b6352;
            text-align: center;
        }

        .footer a {
            color: #6d9176;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #00ff55;
            text-decoration: underline;
        }

        /* Адаптив */
        @media (max-width: 480px) {
            .banner-header {
                height: 190px;
            }
            .avatar-wrap {
                width: 120px;
                height: 120px;
                margin-top: -60px;
            }
            .main-title {
                font-size: 2rem;
            }
            .buttons-container {
                max-width: 290px;
            }
            .social-button {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка-баннер -->
    <header class="banner-header"></header>

    <!-- Профиль: Аватарка и Заголовки -->
    <div class="profile-container">
        <div class="avatar-wrap">
            <img src="Logo.png" alt="NecroMagik Logo" class="avatar-img">
        </div>

        <h1 class="main-title">
            <span class="zn-part">ZN / </span><span class="neeromagik-part">NecroMagik</span>
        </h1>
        <p class="subtitle">Социальные сети и контакты</p>
    </div>

    <!-- Список ссылок -->
    <div class="buttons-container">
        <a href="https://www.youtube.com/@09NecroMagik/" class="social-button youtube-btn" target="_blank" rel="noopener noreferrer">
            YouTube
        </a>

        <a href="https://www.twitch.tv/necromagiktruth" class="social-button twitch-btn" target="_blank" rel="noopener noreferrer">
            Twitch
        </a>

        <a href="https://vk.com/zn_NecroMagik" class="social-button vk-btn" target="_blank" rel="noopener noreferrer">
            ВКонтакте
        </a>

        <a href="https://t.me/NecroThemik" class="social-button tg-btn" target="_blank" rel="noopener noreferrer">
            Telegram
        </a>

        <a href="https://discord.gg/Tdx6xZtt82" class="social-button discord-btn" target="_blank" rel="noopener noreferrer">
            Discord
        </a>
    </div>

    <!-- Футер с политикой конфиденциальности -->
    <footer class="footer">
        <p>© 2026 NecroMagik</p>
        <p style="margin-top: 5px;"><a href="privacy.html">Privacy Policy</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.social-button');
            buttons.forEach((button, index) => {
                button.style.opacity = '0';
                button.style.transform = 'translateY(25px)';
                
                setTimeout(() => {
                    button.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, 150 * index);
            });
        });
    </script>
</body>
</html>
